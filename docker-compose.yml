version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: lms_postgres
    env_file: .env
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_SUPERPASS}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d postgres"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - backend

  core-service:
    build:
      context: ../core-service
      dockerfile: Dockerfile
    image: core-service:dev
    container_name: core_service
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${CORE_DB};Username=${CORE_DB_USER};Password=${CORE_DB_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend

  study-service:
    build:
      context: ../study-service
      dockerfile: Dockerfile
    image: study-service:dev
    container_name: study_service
    env_file: .env
    environment:
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__Db: Host=postgres;Port=5432;Database=${STUDY_DB};Username=${STUDY_DB_USER};Password=${STUDY_DB_PASSWORD}
      Jwt__Issuer: ${JWT_ISSUER}
      Jwt__Audience: ${JWT_AUDIENCE}
      Jwt__SigningKey: ${JWT_SIGNING_KEY}
    depends_on:
      postgres:
        condition: service_healthy
      core-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/health > /dev/null || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
    networks:
      - backend

  nginx:
    image: nginx:1.27
    container_name: lms_nginx
    ports:
      - "${EDGE_PORT:-8080}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      core-service:
        condition: service_healthy
      study-service:
        condition: service_healthy
    networks:
      - backend

networks:
  backend:

volumes:
  pgdata: